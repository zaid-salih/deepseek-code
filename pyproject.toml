# deepseek-code/pyproject.toml
[project]
name = "deepseek-code"
version = "1.0.0"
description = "Complete CLI IDE with DeepSeek AI integration"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "textual>=0.52.0", 
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "gitpython>=3.1.0",
    "pathspec>=0.11.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pygls>=1.0.0",
    "lsprotocol>=2022.0.0",
    "psutil>=5.9.0",           # NEW: System performance monitoring
]

[project.scripts]
deepseek-code = "deepseek_code.cli.main:app"
deepseek = "deepseek_code.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/deepseek-code"
Documentation = "https://github.com/yourusername/deepseek-code#readme"