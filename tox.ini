[tox]
envlist = py38, py39, py310, py311, py312
skipsdist = false

[testenv]
deps =
    pytest>=6.0
    pytest-cov
    flake8
    black
commands =
    flake8 src tests scripts
    black --check src tests scripts
    pytest tests/ -v --cov=src

[testenv:format]
deps = black
commands = black src tests scripts