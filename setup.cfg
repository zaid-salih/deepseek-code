[metadata]
name = deepseek-code
description = AI-Powered CLI IDE with full project context awareness and team collaboration
author = Zaid Salih
author_email = zaid@badinan.com
url = https://github.com/zaid-salih/deepseek-code
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
python_requires = >=3.8
install_requires =
    requests>=2.25.0
    rich>=10.0.0
    typer>=0.9.0
    pyyaml>=6.0
    gitpython>=3.1.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    deepseek-code = deepseek_code.cli.ultimate_main:app

[flake8]
max-line-length = 88
extend-ignore = E203, W503

[coverage:run]
source = src
omit = */tests/*,*/venv/*,*/virtualenv/*